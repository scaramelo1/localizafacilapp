# Localiza Fácil no domínio próprio: localizafacilapp.com.br serve a mesma pasta de fsadesigners.com.br/guia-novo
# Instalado por servidor/dominio/ativar.sh (o certbot cria a versão HTTPS, localizafacilapp-le-ssl.conf)
<VirtualHost *:80>
    ServerName localizafacilapp.com.br
    ServerAlias www.localizafacilapp.com.br
    DocumentRoot /var/www/guia-novo/servidor/publico
    DirectoryIndex index.php index.html
    <Directory /var/www/guia-novo/servidor/publico>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/fsadesigners_erro.log
    SetEnvIf Request_URI "^/api/perto\.php$" sem_localizacao
    CustomLog ${APACHE_LOG_DIR}/localizafacilapp_acesso.log combined env=!sem_localizacao
    CustomLog ${APACHE_LOG_DIR}/localizafacilapp_acesso.log "%h %l %u %t \"%m %U %H\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" env=sem_localizacao
</VirtualHost>
